{% extends "base.html" %}

{% block title %}Login | ExCal{% endblock %}

{% block content %}

<section class="login-section">

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-left">

            <h1>Welcome Back 👋</h1>

            <p>
                Sign in to continue managing your expenses with ExCal. Your financial journey starts here!
            </p>

            <!-- Login Form -->
            <form action="/login" method="POST">

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>

            <p class="register-link">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </p>

        </div>

        <!-- Right Side -->
        <div class="login-right">

            <img src="{{ url_for('static', filename='images/img1.webp') }}"
                alt="ExCal">

        </div>

    </div>

</section>

{% endblock %}
